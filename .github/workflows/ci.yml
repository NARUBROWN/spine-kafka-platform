name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting, vet and module boundary
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          bash scripts/check-module-boundary.sh
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Unit and race tests
        run: go test -race ./... -count=1 -timeout=3m
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start Redpanda
        run: |
          docker run -d --name broker -p 127.0.0.1:19092:9092 redpandadata/redpanda:v24.3.18 redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr 127.0.0.1:19092
          for attempt in $(seq 1 60); do
            if docker exec broker rpk cluster info -X brokers=127.0.0.1:9092 >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs broker
          exit 1
      - name: Broker delivery contract
        env:
          SPINE_TEST_KAFKA_BROKER: 127.0.0.1:19092
        run: go test -race . -run '^TestLive' -count=1 -timeout=2m
